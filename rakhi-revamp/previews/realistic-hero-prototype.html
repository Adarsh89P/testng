<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500&family=Instrument+Serif&family=Caveat:wght@600&display=swap">
<style>html,body{margin:0;background:#fff;font-family:Geist,sans-serif}
.hero{position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(rgba(255,255,255,0),#fff 95%);pointer-events:none}
.night .fade{background:linear-gradient(rgba(14,15,17,0),#0E0F11 95%)}
.intro{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:#10141B}
.night .intro{color:#F5F6F6}
h1{font:400 clamp(48px,6vw,84px)/1 'Instrument Serif',serif;letter-spacing:-1.6px;margin:0}
p{margin:14px auto 0;max-width:720px;font:300 19px/1.6 Geist;color:#5B6474}.night p{color:#a7abb3}
</style></head><body><div class="hero" id="hero"><canvas id="gl"></canvas><canvas id="fg"></canvas><div class="fade"></div>
<div class="intro"><h1>Hi, I’m Rakhi.</h1><p>I design products that feel simple, even when they are not.</p></div></div>
<script id="fs" type="x-shader">
precision highp float;
uniform vec2 R; uniform float T; uniform float HR;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float a=.5,s=0.;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){s+=a*n2(p);p=m*p;a*=.5;}return s;}
float ridged(vec2 p){float a=.5,s=0.,w=1.;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<7;i++){float n=1.-abs(n2(p)*2.-1.);n*=n;s+=n*a*w;w=clamp(n*1.6,0.,1.);p=m*p;a*=.5;}return s;}
const vec2 MC=vec2(1.05,.2); const float MTOP=1.22;      // Key Monastery hill
const vec3 SP=vec3(-.70,.80,-.30); const float K=.95;                       // statue base
float coneH(vec2 p){vec2 q=p-MC;return MTOP-1.25*pow(length(q*vec2(1.,1.15)),1.05)+.04*fbm(p*7.);}
float terrain(vec2 p){
 float rc=0.9*sin(p.y*.18)+.4*sin(p.y*.07+1.);
 float d=abs(p.x-rc);
 float valley=smoothstep(.6,5.5,d);
 float far=smoothstep(3.,26.,p.y);
 float h=.02+.35*fbm(p*.6)*smoothstep(.3,2.5,d);
 if(p.y>-1.){h+=valley*(1.2+3.6*far)*ridged(p*.22+vec2(3.1,1.7));h+=far*far*2.2*ridged(p*.09+vec2(7.,2.));}
 h=max(h,coneH(p));
 vec2 l=p-SP.xz; h=max(h,SP.y-.015-.7*pow(length(l*vec2(.8,1.2)),1.25)+.04*fbm(p*6.));
 return h;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}
// returns distance; m = material id
float monastery(vec3 p,out float m,out vec3 cellInfo){
 m=0.;cellInfo=vec3(0.);
 vec2 q=p.xz-MC; float rr=length(q);
 if(rr>.5||p.y<.7||p.y>MTOP+.15) return max(rr-.46,.03);
 float c=.055; vec2 cid=floor(p.xz/c); float best=1e3;
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
  vec2 id=cid+vec2(i,j); vec2 cc=(id+.5)*c; float hs=h21(id);
  float g=coneH(cc); vec2 cq=cc-MC;
  if(g<.82||cq.y>.06||hs<.1) continue;
  vec3 hb=vec3(.019+.008*h21(id+7.),.018+.022*h21(id+3.),.02);
  vec3 ctr=vec3(cc.x+(hs-.5)*.02,g+hb.y*.8,cc.y);
  float d=sdBox(p-ctr,hb);
  if(d<best){best=d;m=1.;cellInfo=vec3(id,ctr.y+hb.y);}
 }
 // golden roof at the summit
 float top=min(sdBox(p-vec3(MC.x,MTOP+.04,MC.y-.02),vec3(.035,.035,.03)), sdEll(p-vec3(MC.x,MTOP+.09,MC.y-.02),vec3(.018,.022,.018)));
 if(top<best){best=top;m=p.y>MTOP+.072?2.:1.;cellInfo=vec3(9.,9.,MTOP+.075);}
 return best;}
float statue(vec3 p,out float m){
 vec3 q=(p-SP)/K; m=3.; float d=sdBox(q-vec3(0,.055,0),vec3(.12,.055,.12));
 float t1=sdBox(q-vec3(0,.135,0),vec3(.105,.026,.105)); if(t1<d){d=t1;m=4.;}
 float t2=sdBox(q-vec3(0,.185,0),vec3(.095,.025,.095)); if(t2<d){d=t2;m=5.;}
 float lo=sdEll(q-vec3(0,.222,0),vec3(.10,.026,.10)); if(lo<d){d=lo;m=6.;}
 float g=sdEll(q-vec3(0,.262,.0),vec3(.088,.034,.07));                       // crossed legs
 g=min(g,sdEll(q-vec3(0,.33,.008),vec3(.047,.062,.036)));                     // belly
 g=min(g,sdEll(q-vec3(0,.395,.01),vec3(.056,.042,.036)));                     // chest/shoulders
 g=min(g,sdEll(vec3(abs(q.x),q.y,q.z)-vec3(.058,.35,.0),vec3(.017,.055,.02))); // arms
 g=min(g,sdEll(q-vec3(0,.29,-.035),vec3(.04,.016,.022)));                     // hands in lap
 g=min(g,sdEll(q-vec3(0,.44,.01),vec3(.017,.02,.017)));                       // neck
 g=min(g,sdEll(q-vec3(0,.468,.006),vec3(.029,.034,.03)));                     // head
 if(g<d){d=g;m=7.;}
 float hr=sdEll(q-vec3(0,.484,.012),vec3(.03,.022,.03)); if(hr<d&&q.y>.482){d=hr;m=8.;}
 float us=length(q-vec3(0,.51,.012))-.012; if(us<d){d=us;m=8.;}
 float bw=length(q-vec3(0,.296,-.05))-.016; if(bw<d){d=bw;m=8.;}
 return d*K;}
float map(vec3 p,out float m,out vec3 ci){
 float dt=(p.y-terrain(p.xz))*.5; m=0.;
 float mm; vec3 c2; float dm=monastery(p,mm,c2); if(dm<dt){dt=dm;m=mm;ci=c2;}
 float ms; float ds=statue(p,ms); if(ds<dt){dt=ds;m=ms;}
 return dt;}
bool isNight(){return HR<6.||HR>=18.;}
vec3 sunDir(){float a=(HR-6.)/12.*3.14159; if(isNight()) a=mod(HR-18.+24.,24.)/12.*3.14159; return normalize(vec3(-cos(a)*.9,max(sin(a),.02)*.75+.02,.6));}
vec3 skyCol(vec3 rd,vec3 sd){
 float e=sin(clamp((isNight()?mod(HR-18.+24.,24.):HR-6.)/12.,0.,1.)*3.14159);
 float day=isNight()?0.:smoothstep(.0,.35,e);
 float gold=isNight()?0.:(1.-smoothstep(.05,.45,e));
 vec3 zen=mix(vec3(.02,.03,.09),vec3(.10,.30,.62),day); zen=mix(zen,vec3(.16,.18,.38),gold*.6);
 vec3 hor=mix(vec3(.08,.10,.20),vec3(.62,.76,.90),day); hor=mix(hor,vec3(1.,.58,.36),gold);
 float y=clamp(rd.y,0.,1.); vec3 c=mix(hor,zen,pow(y,.55));
 float sdot=max(dot(rd,sd),0.);
 if(!isNight()){c+=vec3(1.,.75,.45)*pow(sdot,8.)*(.25+.6*gold)+vec3(1.,.95,.85)*pow(sdot,600.)*6.;}
 else{c+=vec3(.6,.7,1.)*pow(sdot,40.)*.25+vec3(.9,.92,1.)*smoothstep(.9994,.9997,sdot)*1.5;
  vec2 sp=rd.xz/(rd.y+.15)*60.; float st=h21(floor(sp)); float tw=.6+.4*sin(T*2.+st*40.);
  c+=vec3(1.)*step(.985,st)*smoothstep(.5,0.,length(fract(sp)-.5))*tw*smoothstep(0.,.25,rd.y);
  float st2=h21(floor(sp*1.7)+3.);c+=vec3(.8,.85,1.)*step(.993,st2)*smoothstep(.45,0.,length(fract(sp*1.7)-.5))*.6*smoothstep(0.,.25,rd.y);
  float mw=exp(-pow((rd.y-.35-.25*rd.x)*5.,2.))*fbm(rd.xy*9.);c+=vec3(.32,.33,.48)*mw*.9;}
 return c;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
 vec3 ro=vec3(0.,1.15,-2.);vec3 rd=normalize(vec3(uv.x,uv.y-.04,1.25));
 vec3 sd=sunDir(); bool nt=isNight();
 float e=sin(clamp((nt?mod(HR-18.+24.,24.):HR-6.)/12.,0.,1.)*3.14159);
 float gold=nt?0.:(1.-smoothstep(.05,.45,e));
 vec3 sky=skyCol(rd,sd);
 float t=.1,hit=0.,m=0.;vec3 p,ci;
 for(int i=0;i<220;i++){p=ro+rd*t;float d=map(p,m,ci);if(d<.0006*t){hit=1.;break;}t+=max(d,.0015);if(t>70.)break;}
 vec3 col=sky;
 if(hit>0.){
  vec3 n; float e2=.0008+.0012*t; vec3 dum;float md;
  n=normalize(vec3(map(p+vec3(e2,0,0),md,dum)-map(p-vec3(e2,0,0),md,dum),map(p+vec3(0,e2,0),md,dum)-map(p-vec3(0,e2,0),md,dum),map(p+vec3(0,0,e2),md,dum)-map(p-vec3(0,0,e2),md,dum)));
  vec3 alb; float spec=0.; vec3 emis=vec3(0.);
  if(m<.5){
   vec3 rock=mix(vec3(.36,.24,.17),vec3(.52,.40,.30),fbm(p.xz*3.));
   rock=mix(rock,vec3(.47,.27,.17),smoothstep(.4,.9,fbm(p.xz*.8+3.))*.5);
   float snow=smoothstep(1.35,1.6,p.y+.3*fbm(p.xz*1.3))*smoothstep(.45,.8,n.y)*step(-.2,p.z);
   alb=mix(rock,vec3(.93,.95,1.),snow);
   float rc=0.9*sin(p.z*.18)+.4*sin(p.z*.07+1.);
   float rv=(1.-smoothstep(.05,.14,abs(p.x-rc-.15*sin(p.z*1.3))))*step(p.y,.25)*smoothstep(1.,6.,p.z);
   if(rv>0.){alb=mix(alb,skyCol(reflect(rd,vec3(0,1,0)),sd)*.9+.05,rv);}
  } else if(m<1.5){ // monastery walls
   alb=vec3(.92,.90,.86);
   float topBand=smoothstep(ci.z-.008,ci.z-.005,p.y); alb=mix(alb,vec3(.42,.14,.10),topBand);
   vec2 wp=vec2(abs(n.x)>.5?p.z:p.x,p.y)*vec2(80.,70.);
   float win=step(.62,fract(wp.x))*step(.35,fract(wp.y))*step(fract(wp.y),.75)*step(p.y,ci.z-.01)*(1.-step(.5,n.y));
   float lit=step(.5,h21(floor(wp)+ci.xy));
   alb=mix(alb,vec3(.12,.08,.06),win);
   if(nt) emis=vec3(1.,.7,.35)*win*lit*1.6;
  } else if(m<2.5){alb=vec3(1.,.72,.25);spec=1.;}
  else if(m<3.5){alb=vec3(.10,.62,.80);}
  else if(m<4.5){alb=mix(vec3(.96,.93,.86),vec3(.92,.42,.15),step(.5,fract(atan(p.x-SP.x,p.z-SP.z)*6.)));}
  else if(m<5.5){alb=mix(vec3(.12,.22,.58),vec3(.95,.72,.2),step(.82,fract(atan(p.x-SP.x,p.z-SP.z)*4.)));}
  else if(m<6.5){alb=mix(vec3(.95,.45,.15),vec3(.18,.68,.55),step(SP.y+.226*K,p.y));}
  else if(m<7.5){alb=vec3(1.,.70,.22);spec=1.; vec3 q=(p-SP)/K; if(q.y>.31&&q.y<.43&&abs(q.y-.37-q.x*.9)<.02) {alb=vec3(.72,.16,.12);spec=0.;}}
  else {alb=vec3(.12,.25,.62);}
  float dif=max(dot(n,sd),0.);
  float sh=1.;float st=.02;for(int j=0;j<32;j++){vec3 q=p+n*.002+sd*st;float mm;vec3 cc;float dh=map(q,mm,cc);sh=min(sh,12.*dh/st);st+=clamp(dh,.01,.4);if(sh<0.||st>8.)break;}
  sh=clamp(sh,0.,1.);
  vec3 sunC=nt?vec3(.4,.48,.75)*.8:mix(vec3(1.,.95,.88),vec3(1.,.62,.38),gold)*1.6;
  vec3 amb=nt?vec3(.09,.11,.2):mix(vec3(.30,.38,.52),vec3(.40,.30,.40),gold);
  col=alb*(sunC*dif*sh+amb*(.5+.5*n.y));
  if(spec>0.){vec3 hv=normalize(sd-rd);col+=sunC*vec3(1.,.8,.45)*pow(max(dot(n,hv),0.),40.)*sh*1.2; col+=alb*amb*.4;}
  if(nt&&m>2.5){col+=alb*vec3(1.,.72,.4)*.22;}       // warm floodlight on the statue at night
  col+=emis;
  float fog=1.-exp(-t*(nt?.03:.032));
  col=mix(col,mix(sky,skyCol(vec3(rd.x,.02,rd.z),sd),.7),fog);
 }
 if(rd.y>0.&&hit<.5){vec2 cp=rd.xz/(rd.y+.05)*1.2+vec2(T*.01,0.);float cl=smoothstep(.55,.85,fbm(cp*1.3));
  vec3 cc=nt?vec3(.12,.14,.22):mix(vec3(1.),vec3(1.,.72,.60),gold);cc*=.8+.25*max(sd.y,0.);
  col=mix(col,cc,cl*.75*smoothstep(0.,.15,rd.y));}
 float mist=exp(-max(p.y,0.)*3.)*hit*smoothstep(4.,15.,t);
 col=mix(col,nt?vec3(.10,.12,.2):mix(vec3(.9,.93,.98),vec3(1.,.78,.66),gold),mist*.35);
 col=1.-exp(-col*1.25); col=pow(col,vec3(.95));
 col+=(h21(gl_FragCoord.xy+T)-.5)*.02;
 gl_FragColor=vec4(col,1.);}
</script>
<script>
const Q=new URLSearchParams(location.search); const HR=+(Q.get('t')||10.5);
if(HR<6||HR>=18) document.getElementById('hero').classList.add('night');
const cv=document.getElementById('gl'), gl=cv.getContext('webgl',{antialias:false});
const scale=+(Q.get('s')||0.75);
function size(){cv.width=innerWidth*scale|0;cv.height=innerHeight*scale|0;gl.viewport(0,0,cv.width,cv.height)}
const vs=`attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
size();gl.uniform2f(gl.getUniformLocation(pr,'R'),cv.width,cv.height);gl.uniform1f(gl.getUniformLocation(pr,'HR'),HR);gl.uniform1f(gl.getUniformLocation(pr,'T'),0);
gl.drawArrays(gl.TRIANGLES,0,3);
window.glDone=true;
</script></body></html>
