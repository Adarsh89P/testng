<style>
:root{--ink:#10141B;--muted:#5B6474;--bg:#fff;--line:#E2E4E8;--g1:rgba(16,20,27,.06);--g2:rgba(16,20,27,.035);--pill:rgba(16,20,27,.07);--pl:rgba(16,20,27,.14)}
@media (prefers-color-scheme:dark){:root{--ink:#F5F6F6;--muted:#9D9E9F;--bg:#0E0F11;--line:#2A2B2E;--g1:rgba(255,255,255,.045);--g2:rgba(255,255,255,.022);--pill:rgba(255,255,255,.06);--pl:rgba(255,255,255,.14)}}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 16px/1.6 Geist,-apple-system,sans-serif;
  background-image:linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px),linear-gradient(var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--g2) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:center}
main{text-align:center;max-width:560px}
.moon{width:72px;height:72px;margin:0 auto 28px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff,#e9edf5 55%,#c7cfdc);box-shadow:0 0 40px rgba(180,195,230,.6),inset -10px -4px 0 rgba(160,170,190,.35)}
p.k{font:400 12px/1 "Geist Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(48px,9vw,80px)/.98 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;margin:16px 0;text-wrap:balance}
h1 em{color:var(--muted)}
p.s{color:var(--muted);font-weight:300;font-size:17px}
.a{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;text-decoration:none;color:var(--ink);background:var(--pill);border:1px solid var(--pl);font-size:14px;transition:transform .2s}
a.p{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:12px;font-weight:500}
a:hover{transform:scale(1.04)}
a:focus-visible{outline:2px solid #1F6FD1;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true"></div>
  <p class="k">404 · Page not found</p>
  <h1>This page has <em>drifted off.</em></h1>
  <p class="s">The link may be old, or the page may have moved. The work is all still here.</p>
  <div class="a">
    <a class="p" href="home-preview.html">Back to the homepage</a>
    <a href="home-preview.html#work">See case studies</a>
  </div>
</main>
