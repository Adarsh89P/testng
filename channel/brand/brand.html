<!doctype html><meta charset=utf-8><style>
@font-face{font-family:D;src:url(noto-serif-devanagari-devanagari-700-normal.woff2);font-weight:700}
body{margin:0;background:#1a0f3a;font-family:D}
.logo{width:800px;height:800px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,#e8774a 0,#a23f6e 38%,#3a1f6e 70%,#1a0f3a 100%)}
.ring{position:absolute;left:150px;top:80px;width:500px;height:500px;border-radius:50%;border:14px solid #f6c66a;box-shadow:0 0 60px #f6c66a88,inset 0 0 60px #f6c66a44}
.moon{position:absolute;left:330px;top:40px;width:140px;height:140px;border-radius:50%;background:#fbe7b0;box-shadow:-34px 0 0 0 #a23f6e inset}
.neck{position:absolute;left:300px;top:230px;width:200px;height:290px;background:linear-gradient(#e9e4f4,#cfc6e6);border-radius:90px 90px 40px 40px}
.blue{position:absolute;left:300px;top:430px;width:200px;height:90px;background:#2c58c8;border-radius:0 0 40px 40px;box-shadow:0 0 40px #4d7dff}
.tri{position:absolute;left:386px;top:150px;width:28px;height:420px;background:#f6c66a}
.name{position:absolute;bottom:60px;width:100%;text-align:center;color:#ffe9b8;font-size:92px;text-shadow:0 4px 18px #000a}
.sub{position:absolute;bottom:22px;width:100%;text-align:center;color:#f6c66a;font-size:30px;letter-spacing:4px}
</style><body><div class=logo id=logo><div class=ring></div><div class=moon></div><div class=tri></div><div class=neck></div><div class=blue></div>
<div class=name>पुराण छाया</div><div class=sub>शिव कथाएँ</div></div></body>
